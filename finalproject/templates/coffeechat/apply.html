<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模擬 Coffee Chat 預約</title>
    <!-- 引入 Bootstrap 5 CSS 方便快速排版與呼叫浮動視窗 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2>學生預約申請與進度追蹤 (測試用)</h2>
    <hr>
    
    <!-- 若表單送出成功，顯示成功訊息 -->
    {% if message %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endif %}

    <!-- 模擬前端網頁上已經選好校友與時段的狀態，點擊後觸發 Modal -->
    <button type="button" class="btn btn-warning btn-lg shadow-sm mt-3" data-bs-toggle="modal" data-bs-target="#applyModal">
        ☕ 模擬送出預約表單
    </button>
</div>

<!-- ================= 浮動視窗 (Modal) 結構 ================= -->
<div class="modal fade" id="applyModal" tabindex="-1" aria-labelledby="applyModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-primary fw-bold" id="applyModalLabel">
            填寫 Coffee Chat 預約申請
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- 表單開始 -->
      <form method="POST" action="{% url 'apply_chat' %}">
          <!-- Django 規定 POST 表單必須加上 csrf_token 防護 -->
          {% csrf_token %}
          
          <div class="modal-body p-4">
            
            <!-- 唯讀資訊：告知學生目前預約的對象和時段 -->
            <div class="row mb-4 bg-light p-3 rounded">
                <div class="col-md-6">
                    <label class="form-label text-muted fw-bold">預約校友</label>
                    <!-- 從後端 View 傳過來的假資料 -->
                    <input type="text" class="form-control" value="{{ alumni_name }}" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-muted fw-bold">預約時段</label>
                    <input type="text" class="form-control" value="{{ reserved_time }}" readonly>
                </div>
            </div>
            
            <!-- 學生自行填寫的經歷大綱 -->
            <div class="mb-3">
                <label for="experience_summary" class="form-label fw-bold">你的經歷簡述與自我推薦信 <span class="text-danger">*</span></label>
                <div class="form-text mb-2 text-secondary">請簡短介紹你的背景、專長，讓校友能快速認識你。</div>
                <textarea class="form-control" id="experience_summary" name="experience_summary" rows="4" required placeholder="例如：您好，我是資管系的學生，近期對資料工程很有興趣..."></textarea>
            </div>

            <!-- 學生自行填寫的提問大綱 -->
            <div class="mb-4">
                <label for="questions_outline" class="form-label fw-bold">具體提問大綱 <span class="text-danger">*</span></label>
                <div class="form-text mb-2 text-secondary">請列出你這次 Coffee Chat 想討論的幾個重點問題。</div>
                <textarea class="form-control" id="questions_outline" name="questions_outline" rows="4" required placeholder="1. 請問當時從學校跨足業界的心路歷程？&#10;2. 面試貴公司時最看重什麼能力？"></textarea>
            </div>

          </div>
          
          <div class="modal-footer bg-light">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
            <button type="submit" class="btn btn-primary px-4">確認送出</button>
          </div>
      </form>
      <!-- 表單結束 -->

    </div>
  </div>
</div>
<!-- ================ 浮動視窗 (Modal) 結束 ================= -->

<!-- 引入 Bootstrap 5 JS (負責彈窗動作) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
