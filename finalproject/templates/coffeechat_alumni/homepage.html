<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Chat</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #ffffff; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .mockup-frame {
            background-color: #ffffff;
            width: 100%;
            max-width: 800px;
            padding: 80px 40px;
        }

        .coffee-icon {
            width: 110px;
            height: auto;
            margin-bottom: 12px;
        }

        .chat-title {
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #000;
        }
        .divider {
            border-top: 2px solid #000;
            opacity: 1; /* 覆蓋 Bootstrap 預設的透明度 */
            margin: 24px auto 48px auto;
            width: 90%;
        }
        .custom-btn {
            background-color: #dcdcdc;
            color: #1a1a1a;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 400;
            transition: background-color 0.2s ease;
        }

        .custom-btn:hover {
            background-color: #c8c8c8;
            color: #000;
        }
    </style>
</head>
