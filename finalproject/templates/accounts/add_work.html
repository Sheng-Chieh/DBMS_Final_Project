<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>新增工作經歷</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-card {
            width: 100%;
            max-width: 720px;
            background: white;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        }

        .title {
            font-weight: 800;
        }

        .form-control,
        .form-select {
            border-radius: 14px;
            padding: 12px;
        }

        .btn {
            border-radius: 14px;
            padding: 12px 18px;
        }
    </style>
</head>

<body>

<div class="form-card">

    <h2 class="title mb-3">新增工作經歷</h2>

    <p class="text-secondary mb-4">
        建立你的工作、實習或工讀經歷。
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">公司</label>

            <input class="form-control"
                    list="company-list"
                    name="company_name_display"
                    placeholder="輸入公司名稱搜尋"
                    oninput="setCompanyId(this.value)"
                    required>

            <input type="hidden"
                    name="company_id"
                    id="company-id">

            <datalist id="company-list">
                {% for company in companies %}
                    <option value="{{ company.name }}" data-id="{{ company.company_id }}"></option>
                {% endfor %}
            </datalist>
        </div>

        <div class="mb-3">
            <label class="form-label">工作類型</label>

            <select name="job_type" class="form-select" required>
                <option value="">請選擇工作類型</option>
                <option value="實習">實習</option>
                <option value="全職">全職</option>
                <option value="兼職">兼職</option>
                <option value="工讀">工讀</option>
                <option value="自由接案">自由接案</option>
                <option value="其他">其他</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">職稱</label>

            <input type="text"
                   name="job_title"
                   class="form-control"
                   placeholder="例如：Software Engineer">
        </div>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">開始日期</label>

                <input  type="date"
                        name="start_date"
                        id="start_date"
                        class="form-control"
                        max="{{ today }}"
                        onchange="updateEndDateLimit()">
            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">結束日期</label>

                <input  type="date"
                        name="end_date"
                        id="end_date"
                        class="form-control"
                        max="{{ today }}">
            </div>

        </div>

        <div class="mb-4">

            <label class="form-label">工作描述</label>

            <textarea name="description"
                      class="form-control"
                      rows="4"
                      placeholder="描述你的工作內容"></textarea>

        </div>

        <div class="d-flex gap-3">

            <button type="submit" class="btn btn-primary">
                儲存工作經歷
            </button>

            <a href="/resume/" class="btn btn-outline-secondary">
                返回履歷
            </a>

        </div>

    </form>

</div>
<script>
function setCompanyId(companyName) {
    const datalist = document.getElementById("company-list");
    const hiddenInput = document.getElementById("company-id");

    hiddenInput.value = "";

    for (let option of datalist.options) {
        if (option.value === companyName) {
            hiddenInput.value = option.dataset.id;
            break;
        }
    }
}
function updateEndDateLimit() {
    const startDate = document.getElementById("start_date");
    const endDate = document.getElementById("end_date");

    if (!startDate || !endDate) return;

    if (startDate.value) {
        endDate.min = startDate.value;

        if (endDate.value && endDate.value < startDate.value) {
            endDate.value = "";
        }
    }
}

updateEndDateLimit();
</script>
</body>
</html>
