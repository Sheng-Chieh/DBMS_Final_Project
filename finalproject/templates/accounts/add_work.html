<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>新增工作經歷</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-card {
            width: 100%;
            max-width: 720px;
            background: white;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        }

        .title {
            font-weight: 800;
        }

        .form-select {
            border-radius: 14px;
            padding: 12px;
            }

        .btn {
            border-radius: 14px;
            padding: 12px 18px;
        }

        .ts-wrapper {
            width: 100%;
        }

        .ts-wrapper.single .ts-control {
            min-height: 52px;
            border-radius: 14px;
            border: 1px solid #dee2e6;
            padding: 12px 48px 12px 14px;
            box-shadow: none;
            font-size: 16px;
        }

        .ts-wrapper.single .ts-control::after {
            content: "⌄";
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            color: #64748b;
            pointer-events: none;
        }

        .ts-dropdown {
            border-radius: 14px;
            border: 1px solid #dbeafe;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
            z-index: 9999;
        }

        .ts-dropdown .option {
            padding: 10px 16px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="form-card">

    <h2 class="title mb-3">新增工作經歷</h2>

    <p class="text-secondary mb-4">
        建立你的工作、實習或工讀經歷。
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">公司</label>

            <select name="company_id"
                    id="company-select"
                    class="form-select"
                    required>

                <option value="">搜尋或選擇公司</option>

                {% for company in companies %}
                    <option value="{{ company.company_id }}">
                        {{ company.name }}
                    </option>
                {% endfor %}

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">工作類型</label>

            <select name="job_type" class="form-select" required>
                <option value="">請選擇工作類型</option>
                <option value="實習">實習</option>
                <option value="全職">全職</option>
                <option value="兼職">兼職</option>
                <option value="工讀">工讀</option>
                <option value="自由接案">自由接案</option>
                <option value="其他">其他</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">職稱</label>

            <input type="text"
                   name="job_title"
                   class="form-control"
                   placeholder="例如：Software Engineer">
        </div>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">開始日期</label>

                <input type="date"
                       name="start_date"
                       id="start_date"
                       class="form-control"
                       max="{{ today }}"
                       onchange="updateEndDateLimit()">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">結束日期</label>

                <input type="date"
                       name="end_date"
                       id="end_date"
                       class="form-control"
                       max="{{ today }}">
            </div>

        </div>

        <div class="mb-4">

            <label class="form-label">工作描述</label>

            <textarea name="description"
                      class="form-control"
                      rows="4"
                      placeholder="描述你的工作內容"></textarea>

        </div>

        <div class="d-flex gap-3">

            <button type="submit" class="btn btn-primary">
                儲存工作經歷
            </button>

            <a href="/resume/" class="btn btn-outline-secondary">
                返回履歷
            </a>

        </div>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

<script>
function updateEndDateLimit() {
    const startDate = document.getElementById("start_date");
    const endDate = document.getElementById("end_date");

    if (!startDate || !endDate) return;

    if (startDate.value) {
        endDate.min = startDate.value;

        if (endDate.value && endDate.value < startDate.value) {
            endDate.value = "";
        }
    }
}

document.addEventListener("DOMContentLoaded", function () {
    updateEndDateLimit();

    new TomSelect("#company-select", {
        create: false,
        maxOptions: 100,
        placeholder: "搜尋或選擇公司",
        sortField: {
            field: "text",
            direction: "asc"
        }
    });
});
</script>

</body>
</html>
