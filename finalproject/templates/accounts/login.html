<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入｜校園職涯媒合平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-700">

    <div class="min-h-screen flex flex-col">
        <div class="bg-gradient-to-br from-cyan-400 to-sky-500 px-6 pt-16 pb-28 text-white text-center">
            <h1 class="text-4xl font-extrabold mb-4">校園職涯媒合平台</h1>
            <p class="text-lg text-white/90">透過過去的軌跡，預見未來的可能</p>
        </div>

        <div class="flex-1 flex justify-center px-5 -mt-20">
            <div class="w-full max-w-md bg-white rounded-[28px] shadow-lg border border-slate-200 p-8">
                <div class="mb-8">
                    <h2 class="text-3xl font-extrabold text-slate-800">登入</h2>
                    <p class="text-slate-400 mt-2">登入後查看你的職涯媒合資訊</p>
                </div>

                {% if error %}
                <div class="mb-5 rounded-2xl bg-red-50 border border-red-200 text-red-600 px-4 py-3">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" class="space-y-5">
                    {% csrf_token %}

                    <div>
                        <label class="block font-bold text-slate-700 mb-2">Email</label>
                        <input type="email" name="email" required
                               placeholder="請輸入 Email"
                               class="w-full rounded-2xl border border-slate-200 px-4 py-4 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block font-bold text-slate-700 mb-2">密碼</label>
                        <input type="password" name="password" required
                               placeholder="請輸入密碼"
                               class="w-full rounded-2xl border border-slate-200 px-4 py-4 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <button type="submit"
                            class="w-full rounded-full bg-blue-600 hover:bg-blue-700 text-white text-lg font-bold py-4 shadow-md transition">
                        登入
                    </button>
                </form>

                <div class="mt-7 text-center text-slate-500">
                    還沒有帳號？
                    <a href="/register/" class="font-bold text-blue-600 hover:text-blue-800">立即註冊</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
