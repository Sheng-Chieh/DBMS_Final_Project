<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>新增課程紀錄｜校園職涯媒合平台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
        }

        .form-card {
            width: 100%;
            max-width: 720px;
            background: white;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        }

        .title {
            font-weight: 800;
        }

        .form-control {
            border-radius: 14px;
            padding: 12px;
        }

        .btn {
            border-radius: 14px;
            padding: 12px 18px;
        }

        .hint-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 16px;
            color: #64748b;
            font-size: 15px;
        }

        .small-note {
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="form-card">

    <h2 class="title mb-3">新增課程紀錄</h2>

    <p class="text-secondary mb-4">
        請填寫你修過的重要課程。這些資料之後可以幫助系統了解你的學習背景，
        並作為尋找相似校友的參考。
    </p>

    <div class="hint-box mb-4">
        建議填寫與職涯方向相關的課程，例如：資料庫管理、資料結構、Java 程式設計、系統分析與設計。
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">課程名稱</label>

            <input type="text"
                   name="course_name"
                   class="form-control"
                   placeholder="例如：資料庫管理"
                   required>

            <div class="small-note mt-1">
                請盡量填寫正式課程名稱，方便之後進行相似背景分析。
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">學期</label>

            <input type="text"
                   name="semester"
                   class="form-control"
                   placeholder="例如：113-1">
        </div>

        <div class="mb-4">
            <label class="form-label">成績</label>

            <input type="text"
                   name="grade"
                   class="form-control"
                   placeholder="例如：A、A-、B+">

            <div class="small-note mt-1">
                成績可選填，若不想公開或尚未取得成績，可以先留空。
            </div>
        </div>

        <div class="d-flex gap-3 flex-wrap">
            <button type="submit" class="btn btn-primary">
                新增課程
            </button>

            <a href="/resume/" class="btn btn-outline-secondary">
                返回履歷
            </a>
        </div>
    </form>

</div>

</body>
</html>
