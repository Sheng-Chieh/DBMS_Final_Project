<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>新增課程紀錄｜校園職涯媒合平台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
            padding: 40px 20px;
        }

        .form-card {
            width: 100%;
            max-width: 720px;
            background: white;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        }

        .title {
            font-weight: 800;
        }

        .form-control,
        .form-select {
            border-radius: 14px;
            padding: 12px;
        }

        .btn {
            border-radius: 14px;
            padding: 12px 18px;
        }

        .hint-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 16px;
            color: #64748b;
            font-size: 15px;
        }

        .small-note {
            color: #64748b;
            font-size: 14px;
        }

        .ts-wrapper {
            width: 100%;
        }

        .ts-wrapper.multi .ts-control {
            min-height: 52px;
            border-radius: 14px;
            border: 1px solid #dee2e6;
            padding: 8px 12px;
            box-shadow: none;
            font-size: 16px;
        }

        .ts-wrapper.focus .ts-control {
            border-color: #86b7fe;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
        }

        .ts-control .item {
            background: #dbeafe;
            color: #1d4ed8;
            border-radius: 999px;
            padding: 4px 10px;
            font-weight: 600;
            border: none;
        }

        .ts-dropdown {
            border-radius: 14px;
            border: 1px solid #dbeafe;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
            z-index: 9999;
        }

        .ts-dropdown .option {
            padding: 10px 16px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="form-card">

    <h2 class="title mb-3">新增課程紀錄</h2>

    <p class="text-secondary mb-4">
        請填寫你修過的重要課程。這些資料之後可以幫助系統了解你的學習背景，
        並作為尋找相似校友的參考。
    </p>

    <div class="hint-box mb-4">
        建議填寫與職涯方向相關的課程，例如：資料庫管理、資料結構、Java 程式設計、系統分析與設計。
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">課程名稱</label>

            <input type="text"
                   name="course_name"
                   class="form-control"
                   placeholder="例如：資料庫管理"
                   required>

            <div class="small-note mt-1">
                請盡量填寫正式課程名稱，方便之後進行相似背景分析。
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">課程技能標籤</label>

            <select name="tag_ids"
                    class="form-select course-tag-select"
                    multiple>

                {% for tag in course_tags %}
                    <option value="{{ tag.tag_id }}">
                        {{ tag.tag_name }}
                    </option>
                {% endfor %}

            </select>

            <div class="small-note mt-1">
                可選多個標籤，例如：資料庫、SQL、後端、程式設計。
            </div>
        </div>

        <div class="col-md-6 mb-3">
        <label class="form-label">年級</label>
        <select id="grade_level" class="form-select">
            <option value="">請選擇年級</option>
            <option value="大一">大一</option>
            <option value="大二">大二</option>
            <option value="大三">大三</option>
            <option value="大四">大四</option>
            <option value="研究所">研究所</option>
            <option value="其他">其他</option>
        </select>
    </div>

    <div class="col-md-6 mb-3">
        <label class="form-label">學期</label>
        <select id="semester_term" class="form-select">
            <option value="">請選擇學期</option>
            <option value="上學期">上學期</option>
            <option value="下學期">下學期</option>
            <option value="暑期">暑期</option>
        </select>
    </div>
<input type="hidden" name="semester" id="semester-value">

        <div class="mb-4">
            <label class="form-label">成績</label>

            <select name="grade" class="form-select">
                <option value="">請選擇成績</option>
                <option value="A+">A+</option>
                <option value="A">A</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B">B</option>
                <option value="B-">B-</option>
                <option value="C+">C+</option>
                <option value="C">C</option>
                <option value="C-">C-</option>
                <option value="D">D</option>
            </select>

            <div class="small-note mt-1">
                成績可選填，若不想公開或尚未取得成績，可以先留空。
            </div>
        </div>

        <div class="d-flex gap-3 flex-wrap">
            <button type="submit" class="btn btn-primary">
                新增課程
            </button>

            <a href="/resume/" class="btn btn-outline-secondary">
                返回履歷
            </a>
        </div>
    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    new TomSelect(".course-tag-select", {
        plugins: ["remove_button"],
        create: false,
        maxOptions: 100,
        placeholder: "搜尋或選擇課程技能標籤"
    });
});
function updateSemesterValue() {
    const gradeLevel = document.getElementById("grade_level").value;
    const semesterTerm = document.getElementById("semester_term").value;

    document.getElementById("semester-value").value =
        gradeLevel && semesterTerm ? gradeLevel + semesterTerm : "";
}

document.getElementById("grade_level").addEventListener("change", updateSemesterValue);
document.getElementById("semester_term").addEventListener("change", updateSemesterValue);
</script>

</body>
</html>
