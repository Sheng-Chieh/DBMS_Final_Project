<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>新增活動經歷｜校園職涯媒合平台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
            padding: 40px 20px;
        }

        .form-card {
            width: 100%;
            max-width: 760px;
            background: white;
            border-radius: 28px;
            padding: 42px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        }

        .title {
            font-weight: 800;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 32px;
        }

        .form-control,
        .form-select {
            border-radius: 16px;
            padding: 14px;
        }

        textarea.form-control {
            min-height: 130px;
            resize: none;
        }

        .btn {
            border-radius: 14px;
            padding: 12px 20px;
            font-weight: 600;
        }

        .hint-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 18px;
            color: #64748b;
            margin-bottom: 28px;
        }

    </style>
</head>

<body>

<div class="form-card">

    <h2 class="title">
        新增活動經歷
    </h2>

    <p class="subtitle">
        記錄你的社團、競賽、專案與課外經歷，
        幫助建立完整的職涯發展軌跡。
    </p>

    <div class="hint-box">
        例如：資管系學會、黑客松競賽、AI 專題、志工服務等。
    </div>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-4">

            <label class="form-label">
                活動類型
            </label>

            <select name="category" class="form-select" required>

                <option value="">
                    請選擇活動類型
                </option>

                <option value="社團">社團</option>

                <option value="競賽">競賽</option>

                <option value="專案">專案</option>

                <option value="志工">志工</option>

                <option value="活動籌辦">活動籌辦</option>

                <option value="研究計畫">研究計畫</option>

                <option value="課外學習">課外學習</option>

                <option value="其他">其他</option>

            </select>

        </div>

        <div class="mb-4">

            <label class="form-label">
                標題
            </label>

            <input type="text"
                   name="title"
                   class="form-control"
                   placeholder="例如：資管系學會、黑客松競賽"
                   required>

        </div>

        <div class="mb-4">

            <label class="form-label">
                角色
            </label>

            <input type="text"
                   name="role"
                   class="form-control"
                   placeholder="例如：活動長、隊長、組員">

        </div>

        <div class="row">

            <div class="col-md-6 mb-4">

                <label class="form-label">
                    開始日期
                </label>

                <input type="date"
                       name="start_date"
                       class="form-control">

            </div>

            <div class="col-md-6 mb-4">

                <label class="form-label">
                    結束日期
                </label>

                <input type="date"
                       name="end_date"
                       class="form-control">

            </div>

        </div>

        <div class="mb-4">

            <label class="form-label">
                描述
            </label>

            <textarea name="description"
                      class="form-control"
                      placeholder="簡單描述你在這段經歷中負責的內容或成果"></textarea>

        </div>

        <div class="d-flex gap-3 flex-wrap">

            <button type="submit" class="btn btn-primary">
                新增活動
            </button>

            <a href="/resume/" class="btn btn-outline-secondary">
                返回履歷
            </a>

        </div>

    </form>

</div>

</body>
</html>
